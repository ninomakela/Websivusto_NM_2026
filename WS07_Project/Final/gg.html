<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Home</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --bg-color: #111;
      --text-color: #fff;
      --accent: #0d6efd;
    }

    [data-theme="light"] {
      --bg-color: #f8f9fa;
      --text-color: #111;
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      transition: 0.3s;
    }

    .hero {
      height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                  url('https://picsum.photos/1600/900') center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    [data-theme="light"] .hero {
      background: linear-gradient(rgba(255,255,255,0.6), rgba(255,255,255,0.6)),
                  url('https://picsum.photos/1600/900') center/cover;
    }

    .btn-custom {
      background: var(--accent);
      border: none;
      padding: 10px 25px;
      border-radius: 25px;
      color: white;
    }

    .toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
    }
  </style>
</head>

<body>

<!-- Toggle Button -->
<button class="btn btn-outline-light toggle-btn" onclick="toggleTheme()">
  Toggle Mode
</button>

<!-- HERO -->
<div class="hero container-fluid">
  <div>
    <h1 class="display-4 fw-bold">Welcome</h1>
    <p class="lead mb-4">Simple, clean Bootstrap homepage</p>
    <button class="btn-custom">Get Started</button>
  </div>
</div>

<!-- EXTRA SECTION -->
<div class="container text-center py-5">
  <h2>About</h2>
  <p class="text-muted">
    This is a minimal homepage with a dark/light mode toggle using Bootstrap.
  </p>
</div>

<script>
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute("data-theme");

  if (current === "dark") {
    html.setAttribute("data-theme", "light");
  } else {
    html.setAttribute("data-theme", "dark");
  }
}
</script>

</body>
</html>
